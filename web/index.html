<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>25 &amp; 5</title>
<style>
  :root { color-scheme: dark; }
  #app { --a:#ff7a59; --b:#8b5cf6; --c:#f43f5e; }
  #app[data-mode="break"] { --a:#2dd4bf; --b:#38bdf8; --c:#22c55e; }

  html, body { height:100%; margin:0; }
  body {
    background:#0e1020; color:#fff; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  #app { position:fixed; inset:0; display:grid; place-items:center; padding:16px; }

  /* Moving colour blobs behind the glass */
  .bg { position:absolute; inset:0; overflow:hidden; background:#0e1020; }
  .bg i { position:absolute; border-radius:50%; filter:blur(60px); opacity:.75;
          transition:background-color 1.2s ease; }
  .bg i:nth-child(1){ background:var(--a); width:60vmax; height:60vmax; top:-20vmax; left:-15vmax;
                      animation:drift 18s ease-in-out infinite alternate; }
  .bg i:nth-child(2){ background:var(--b); width:60vmax; height:60vmax; bottom:-25vmax; right:-15vmax;
                      animation:drift 22s ease-in-out infinite alternate-reverse; }
  .bg i:nth-child(3){ background:var(--c); width:35vmax; height:35vmax; top:30%; left:40%; opacity:.5;
                      animation:drift 26s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translate(8vmax,6vmax) scale(1.15); } }

  /* Liquid glass card */
  .card {
    position:relative; width:min(360px,100%); box-sizing:border-box;
    padding:22px 24px 18px; border-radius:30px; text-align:center;
    background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06) 55%,rgba(255,255,255,.12));
    -webkit-backdrop-filter:blur(28px) saturate(170%); backdrop-filter:blur(28px) saturate(170%);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.6), inset 0 -10px 30px rgba(255,255,255,.05),
               0 24px 60px rgba(0,0,0,.35);
  }
  .card::before {
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.35),transparent 50%);
    mix-blend-mode:overlay;
  }

  .mode { font-size:12px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; opacity:.85; }
  .time {
    font-size:clamp(48px,16vmin,96px); font-weight:200; line-height:1.05;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em;
    margin:4px 0 10px; cursor:pointer; user-select:none; -webkit-user-select:none;
    text-shadow:0 2px 20px rgba(0,0,0,.15); transition:opacity .3s;
  }
  .paused .time { animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity:.45; } }

  .bar { height:4px; border-radius:4px; background:rgba(255,255,255,.18); overflow:hidden; }
  .bar span { display:block; height:100%; width:0; background:rgba(255,255,255,.9);
              border-radius:inherit; transition:width .25s linear; }

  .controls { display:flex; justify-content:center; gap:10px; margin-top:14px; }
  button {
    width:42px; height:42px; border-radius:50%; padding:0; cursor:pointer;
    display:grid; place-items:center; color:#fff;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .15s, background .2s;
  }
  button:hover { background:rgba(255,255,255,.22); }
  button:active { transform:scale(.92); }
  button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  button svg { width:18px; height:18px; }

  .hint { margin-top:12px; font-size:11px; opacity:.6; min-height:1.3em; }

  #placeholder { position:fixed; inset:0; display:grid; place-items:center; text-align:center;
                 padding:24px; opacity:.7; font-size:14px; }

  /* Compact layout inside the floating always-on-top window */
  .pip #app { padding:8px; }
  .pip .card { padding:12px 14px; border-radius:22px; }
  .pip .time { font-size:clamp(36px,22vmin,72px); margin:2px 0 8px; }
  .pip .controls { margin-top:10px; gap:8px; }
  .pip button { width:34px; height:34px; }
  .pip .hint, .pip #floatBtn { display:none; }
</style>
</head>
<body>
  <div id="app" data-mode="focus" class="paused">
    <div class="bg"><i></i><i></i><i></i></div>
    <main class="card">
      <div class="mode" id="mode">Focus</div>
      <div class="time" id="time" title="Click to pause / resume">25:00</div>
      <div class="bar"><span id="progress"></span></div>
      <div class="controls">
        <button id="toggleBtn" title="Start / pause (Space)" aria-label="Start or pause"></button>
        <button id="skipBtn" title="Skip to next (S)" aria-label="Skip">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7zM16 5h2v14h-2z"/></svg>
        </button>
        <button id="resetBtn" title="Reset (R)" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></svg>
        </button>
        <button id="floatBtn" title="Float on top of other apps (F)" aria-label="Float on top">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
      <div class="hint" id="hint">Space start/pause · S skip · R reset · F float</div>
    </main>
  </div>
  <div id="placeholder" hidden>The timer is floating on top.<br>Close the floating window to bring it back here.</div>

<script>
(() => {
  const DUR = { focus: 25 * 60 * 1000, break: 5 * 60 * 1000 };
  const LABEL = { focus: 'Focus', break: 'Break' };
  const ICON_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>';

  const $ = id => document.getElementById(id);
  const app = $('app'), modeEl = $('mode'), timeEl = $('time'), progress = $('progress'),
        toggleBtn = $('toggleBtn'), skipBtn = $('skipBtn'), resetBtn = $('resetBtn'),
        floatBtn = $('floatBtn'), hint = $('hint'), placeholder = $('placeholder');

  const pipSupported = 'documentPictureInPicture' in window;
  if (!pipSupported) {
    floatBtn.hidden = true;
    hint.textContent = 'Space start/pause · S skip · R reset';
  }
  const defaultHint = hint.textContent;

  let mode = 'focus', running = false, remaining = DUR.focus, endAt = 0, pipWin = null;

  // ---- Timer (timestamp based, so it stays accurate in background tabs) ----
  function start() {
    if (running) return;
    endAt = Date.now() + remaining;
    running = true;
    askNotifyPermission();
  }
  function pause() {
    if (!running) return;
    remaining = Math.max(0, endAt - Date.now());
    running = false;
  }
  function toggle() { running ? pause() : start(); unlockAudio(); render(); }

  function switchMode(overshoot = 0) {
    mode = mode === 'focus' ? 'break' : 'focus';
    remaining = DUR[mode] - overshoot;
    if (running) endAt = Date.now() + remaining;
    chime(mode);
    notify(mode === 'break' ? 'Focus done. Take 5.' : 'Break over. Back to focus.');
    render();
  }
  function skip()  { unlockAudio(); switchMode(); }
  function reset() { running = false; mode = 'focus'; remaining = DUR.focus; render(); }

  function update() {
    if (running) {
      remaining = endAt - Date.now();
      if (remaining <= 0) return switchMode(Math.min(-remaining, DUR.break - 1000));
    }
    render();
  }

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  let lastIcon = null;
  function render() {
    const t = fmt(remaining);
    timeEl.textContent = t;
    modeEl.textContent = running || remaining < DUR[mode] ? LABEL[mode] : LABEL[mode] + ' · ready';
    progress.style.width = (100 * (1 - remaining / DUR[mode])).toFixed(2) + '%';
    app.dataset.mode = mode;
    app.classList.toggle('paused', !running);
    const icon = running ? 'pause' : 'play';
    if (icon !== lastIcon) { toggleBtn.innerHTML = running ? ICON_PAUSE : ICON_PLAY; lastIcon = icon; }
    const title = `${t} · ${LABEL[mode]}${running ? '' : ' (paused)'}`;
    document.title = title;
    if (pipWin) pipWin.document.title = title;
  }

  // ---- Sound ----
  let ctx = null;
  function unlockAudio() {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch {}
  }
  function chime(next) {
    if (!ctx) return;
    const notes = next === 'break' ? [880, 660] : [660, 880];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + i * 0.22;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.9);
      o.connect(g).connect(ctx.destination);
      o.start(t0); o.stop(t0 + 1);
    });
  }

  // ---- Notifications (only when the page is hidden) ----
  function askNotifyPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
      try { Notification.requestPermission(); } catch {}
    }
  }
  function notify(msg) {
    if (!document.hidden || pipWin) return;
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification('25 & 5', { body: msg, silent: true }); } catch {}
    }
  }

  // ---- Floating always-on-top window (Chrome / Edge desktop) ----
  async function togglePip() {
    if (!pipSupported) return flash('Floating mode needs Chrome or Edge on a computer');
    if (pipWin) { pipWin.close(); return; }
    try {
      pipWin = await documentPictureInPicture.requestWindow({ width: 300, height: 190 });
    } catch { return flash('Could not open the floating window'); }

    for (const sheet of document.styleSheets) {
      const s = pipWin.document.createElement('style');
      s.textContent = [...sheet.cssRules].map(r => r.cssText).join('\n');
      pipWin.document.head.append(s);
    }
    pipWin.document.body.classList.add('pip');
    pipWin.document.body.append(app);
    placeholder.hidden = false;
    pipWin.addEventListener('keydown', onKey);
    pipWin.addEventListener('pagehide', () => {
      document.body.prepend(app);
      placeholder.hidden = true;
      pipWin = null;
      render();
    });
    render();
  }

  let flashTimer;
  function flash(msg) {
    hint.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => (hint.textContent = defaultHint), 3000);
  }

  // ---- Input ----
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'p' || k === 'k') { e.preventDefault(); toggle(); }
    else if (k === 's') skip();
    else if (k === 'r') reset();
    else if (k === 'f') togglePip();
  }
  window.addEventListener('keydown', onKey);

  const click = (el, fn) => el.addEventListener('click', e => { fn(); el.blur?.(); });
  click(toggleBtn, toggle);
  click(timeEl, toggle);
  click(skipBtn, skip);
  click(resetBtn, reset);
  click(floatBtn, togglePip);

  setInterval(update, 250);
  render();
})();
</script>
</body>
</html>
