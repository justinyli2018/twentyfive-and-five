<!doctype html>
<html lang="en" data-glass="frosted">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<title>25 &amp; 5</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card paused" id="card" data-mode="focus">
    <button class="menu" id="menuBtn" aria-label="Menu" title="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <div class="mode" id="mode">Focus</div>
    <div class="time" id="time">25:00</div>
    <div class="bar"><span id="progress"></span></div>
    <div class="controls">
      <button id="toggleBtn" aria-label="Start or pause"></button>
      <button id="skipBtn" aria-label="Skip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7zM16 5h2v14h-2z"/></svg>
      </button>
      <button id="resetBtn" aria-label="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/></svg>
      </button>
    </div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
